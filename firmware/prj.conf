CONFIG_ZIGBEE=y
CONFIG_ZIGBEE_ROLE_ROUTER=y
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y
CONFIG_ZIGBEE_CHANNEL_MASK=0x07FFF800
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_PWM=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
# Never block the log thread when no RTT host is attached
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
# Console is RTT only; uart0 pins overlap pump 1 PWM (P0.06/P0.08)
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CRYPTO=y
CONFIG_CRYPTO_NRF_ECB=y
CONFIG_RAM_POWER_DOWN_LIBRARY=n
# Zephyr IP stack must stay out of ZBOSS's radio (matches Nordic Zigbee samples)
CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n
# No QSPI flash chip on nice!nano-compatible boards
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
